
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>منصة الرياضيات التفاعلية | أ.عبدالعزيز خالد العبلان</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3C!-- Cap Base (Dark Blue) --%3E%3Cpath d='M25 58 V72 Q50 85 75 72 V58' fill='%231e40af' /%3E%3C!-- Cap Top (Primary Blue) --%3E%3Cpath d='M50 25 L90 50 L50 75 L10 50 Z' fill='%232563eb' stroke='%231e40af' stroke-width='2'/%3E%3C!-- Tassel Button --%3E%3Ccircle cx='50' cy='50' r='5' fill='%231d4ed8'/%3E%3C!-- Tassel (White) --%3E%3Cline x1='50' y1='50' x2='85' y2='65' stroke='white' stroke-width='4'/%3E%3Ccircle cx='85' cy='65' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e3e8f2;--ok:#15803d;--lock1:#d5dbe6;--lock2:#a9b3c4;--ac:#2563eb;--ac-d:#1e40af;--nav:64px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--text:#e8ecf6;--muted:#93a0b8;--line:#263049;--ok:#4ade80;--lock1:#2b3550;--lock2:#1c2438;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--text:#e8ecf6;--muted:#93a0b8;--line:#263049;--ok:#4ade80;--lock1:#2b3550;--lock2:#1c2438;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.6;overflow-x:clip;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px))}
body.has-dock{padding-bottom:calc(var(--nav) + 230px + env(safe-area-inset-bottom,0px))}
button,input{font-family:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
svg{display:block}
a{color:inherit}
.g1{--g1:#fb923c;--g2:#ea580c;--g3:#c2410c}
.g2{--g1:#38bdf8;--g2:#0284c7;--g3:#075985}
.col{max-width:480px;margin:0 auto;padding:0 16px}
.pre{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--ac);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 20px 40px -24px rgba(15,23,42,.35)}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(140deg,#3b82f6,#1e40af);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #1e3a8a}
.lcard h1{margin:0;font-size:24px;font-weight:900;line-height:1.4}
.lcard p{margin:4px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.lcard hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.inp{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--text);text-align:center;font-size:20px;font-weight:700;padding:0 14px;letter-spacing:1px}
.inp:focus{border-color:var(--ac);outline:none}
.err{margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#ef4444 14%,var(--card));border:1px solid color-mix(in srgb,#ef4444 40%,var(--line));color:#b91c1c;font-size:14px;font-weight:700}
.link{margin-top:16px;border:0;background:none;color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;min-height:44px;padding:0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div:last-child{min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block;font-size:15px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.hd-r{display:flex;align-items:center;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--text)}
.pill svg{color:#f59e0b}
button.pill{cursor:pointer;min-height:40px;color:var(--ac)}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:0 0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:9px 16px;max-width:480px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;font-size:12px;opacity:.85}
.chip.dx{border:2px solid color-mix(in srgb,#8b5cf6 60%,var(--line));background:color-mix(in srgb,#8b5cf6 12%,var(--card));color:color-mix(in srgb,#7c3aed 70%,var(--text))}
.chip.dx.pulse{animation:dxp 1.8s ease-out infinite}
@keyframes dxp{0%{box-shadow:0 0 0 0 rgba(139,92,246,.55)}100%{box-shadow:0 0 0 8px rgba(139,92,246,0)}}
.sepv{flex:none;width:1px;background:var(--line);margin:8px 2px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on i{background:#fff}
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,#8b5cf6 12%,var(--card));border:1px solid color-mix(in srgb,#8b5cf6 35%,var(--line));margin-bottom:12px;font-weight:700;font-size:14px}
.strip span{flex:1;line-height:1.4}
.strip button{min-height:40px;border:0;border-radius:12px;padding:0 16px;background:#8b5cf6;color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #6d28d9}
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(140deg,var(--ac),var(--ac-d));color:#fff;padding:16px;scroll-margin-top:76px}
.sym{position:absolute;font-weight:900;font-size:64px;line-height:1;opacity:.11;pointer-events:none;user-select:none}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .k{font-size:13px;font-weight:600;opacity:.9}
.hero h2{margin:0;font-size:22px;font-weight:900;line-height:1.35}
.ring{position:relative;width:72px;height:72px;flex:none}
.rn{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:900}
.stats{position:relative;display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:6px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:800;line-height:1.4}
.stat span{font-size:11px;opacity:.92}
#map{position:relative;width:100%;padding:12px 0 8px}
#lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:14px 0 8px}
.row .nw,.row .lab{transform:translateX(var(--o,0px))}
.nw{position:relative;width:80px;height:80px;flex:none}
.node{width:80px;height:80px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;position:relative;background:var(--face);box-shadow:0 7px 0 var(--edge),0 14px 22px -10px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--edge)}
.st-excellent{--face:#fbbf24;--edge:#d97706}
.st-good{--face:#22c55e;--edge:#15803d}
.st-improve{--face:#f43f5e;--edge:#be123c}
.st-current{--face:var(--ac);--edge:var(--ac-d)}
.st-new{--face:color-mix(in srgb,var(--ac) 16%,var(--card));--edge:color-mix(in srgb,var(--ac) 45%,var(--line));color:var(--ac)}
.st-locked{--face:var(--lock1);--edge:var(--lock2);color:var(--muted)}
.st-diag{--face:#8b5cf6;--edge:#6d28d9}
.st-current::after,.node.pulse::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--ac);opacity:.55;animation:pulse 1.8s ease-out infinite;pointer-events:none}
.node.pulse::after{border-color:#8b5cf6}
@keyframes pulse{to{transform:scale(1.28);opacity:0}}
.flash .node{animation:flash .5s ease-in-out 3}
@keyframes flash{50%{transform:scale(1.14)}}
.gb{position:absolute;bottom:-12px;width:36px;height:36px;padding:0;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(145deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--g3);z-index:2}
.gb::before{content:'';position:absolute;inset:-6px;border-radius:50%}
.gb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g3)}
.gb.r{right:-14px}
.gb.l{left:-14px}
.gb.lk{background:var(--lock1);color:var(--muted);box-shadow:0 3px 0 var(--lock2)}
.mb{position:absolute;bottom:-8px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--card);border:3px solid var(--bg);display:grid;place-items:center;box-shadow:0 3px 0 var(--lock2);z-index:2}
.ck{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#22c55e;color:#fff;border:2px solid var(--bg);display:grid;place-items:center}
.lab{margin-top:20px;width:100%;max-width:196px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;cursor:pointer}
.lab.cur{border:2px solid var(--ac);padding:7px 11px}
.lab h4{margin:0;font-size:14px;font-weight:800;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab h4 b{color:var(--ac);font-weight:900;margin-inline-end:4px}
.stars{display:flex;justify-content:center;gap:3px;margin-top:2px}
.tag{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.lab.cur .tag{color:var(--ac)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:14px 0 0}
.foot p{margin:0 0 8px}
.soc{display:flex;justify-content:center;align-items:center;gap:10px}
.soc a{display:block}
.soc svg{width:32px;height:32px}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:35;padding:30px 16px 12px;background:linear-gradient(to top,var(--bg) 68%,transparent);pointer-events:none}
.dock:empty{display:none}
.dock-in{max-width:448px;margin:0 auto;display:grid;gap:9px}
.dock button{pointer-events:auto}
.dmsg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);padding:0 4px}
.dmsg svg{color:var(--ac)}
.dsec{margin-inline-start:auto;border:0;background:none;color:var(--ac);font-weight:800;font-size:12.5px;cursor:pointer;min-height:32px;text-decoration:underline;pointer-events:auto}
.games{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gbtn{position:relative;display:flex;align-items:center;gap:9px;min-height:58px;padding:6px 9px;border-radius:18px;background:var(--card);border:2px solid color-mix(in srgb,var(--g1) 55%,var(--line));box-shadow:0 4px 0 color-mix(in srgb,var(--g2) 55%,transparent);cursor:pointer;text-align:right;min-width:0;color:var(--text);transition:transform .08s,box-shadow .08s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--g2) 55%,transparent)}
.gbtn.hl{animation:hl 1.8s ease-out infinite}
@keyframes hl{0%{box-shadow:0 4px 0 color-mix(in srgb,var(--g2) 55%,transparent),0 0 0 0 color-mix(in srgb,var(--g1) 60%,transparent)}100%{box-shadow:0 4px 0 color-mix(in srgb,var(--g2) 55%,transparent),0 0 0 12px transparent}}
.here{position:absolute;top:-10px;left:8px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;padding:1px 9px;border-radius:999px}
.gt{position:relative;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--g3)}
.gt.lk{background:var(--lock1);color:var(--muted);box-shadow:0 3px 0 var(--lock2)}
.gtx{min-width:0;flex:1}
.gtx small{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:800;line-height:1.3}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:0;border-radius:18px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 5px 0 var(--ac-d),0 14px 24px -12px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ac-d)}
.cta.dx{background:#8b5cf6;box-shadow:0 5px 0 #6d28d9,0 14px 24px -12px rgba(0,0,0,.45)}
.alldone{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border-radius:18px;background:var(--card);border:2px solid #f59e0b;color:var(--text);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #d97706;text-align:right}
.alldone svg:first-child{color:#f59e0b}
.alldone span{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 5px 0 var(--ac-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ac-d)}
.btn.lock{background:var(--lock1);color:var(--muted);box-shadow:0 5px 0 var(--lock2)}
.btn.dx{background:#8b5cf6;box-shadow:0 5px 0 #6d28d9}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 4px 0 var(--line)}
.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:70}
.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mini{width:52px;height:52px;border-radius:50%;background:var(--face);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--edge)}
.sh-head h3{margin:0;font-size:17px;font-weight:800;line-height:1.5}
.sh-head small{color:var(--muted);font-weight:700;font-size:13px}
.note{margin:0 0 6px;padding:10px 12px;border-radius:14px;background:var(--bg);color:var(--muted);font-size:14px;font-weight:700;line-height:1.6}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:700;font-size:15px}
.lrow span:last-child{color:var(--muted)}
.gr{display:flex;align-items:center;gap:12px;min-height:66px;border-top:1px solid var(--line);font-weight:700;font-size:15px}
.gr .nm{flex:1;min-width:0;line-height:1.35}
.gr .nm small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.gplay{min-height:44px;border:0;border-radius:12px;padding:0 20px;background:var(--g2);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--g3)}
.gplay.lk{background:var(--lock1);color:var(--muted);box-shadow:0 3px 0 var(--lock2)}
.sh-btn{margin-top:14px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:40}
.nav button{flex:1;max-width:160px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:none;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;border-radius:14px}
.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.toast{position:fixed;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:90%;text-align:center}
body.has-dock .toast{bottom:calc(var(--nav) + 200px + env(safe-area-inset-bottom,0px))}
.toast.on{opacity:1}
.gm{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.gm-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.gm-h b{font-size:15px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm iframe{flex:1;width:100%;border:0;background:#fff}
.pc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.pc h3{margin:0 0 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.pc h3 svg{color:var(--ac)}
.prof{display:flex;align-items:center;gap:12px}
.prof .av{width:54px;height:54px;font-size:22px}
.prof b{display:block;font-size:17px;font-weight:800;line-height:1.4}
.prof small{color:var(--muted);font-weight:700;font-size:13px}
.pr{display:flex;align-items:center;gap:16px}
.legend{display:grid;gap:8px;font-size:13.5px;font-weight:700;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--bg);text-align:center;min-width:0}
.mt b{font-size:14px;font-weight:800}
.mt small{font-size:12px;font-weight:700;color:var(--muted)}
.mt small.bad{color:#dc2626}
.mt .msc{margin-top:4px;padding:1px 8px;border-radius:8px;border:1px solid var(--ac);font-size:12px;font-weight:800;color:var(--ac);background:var(--card)}
.mt.on{background:color-mix(in srgb,#f59e0b 10%,var(--bg))}
.mlock{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.cbar{position:relative;height:16px;border-radius:8px;background:var(--line);margin:22px 4px 14px}
.cfill{height:100%;border-radius:8px;background:var(--ac);min-width:4px}
.ctick{position:absolute;top:-5px;width:3px;height:26px;border-radius:2px;background:var(--muted);opacity:.6}
.cchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{padding:10px 4px;border-radius:14px;background:var(--bg);text-align:center;font-weight:800;font-size:13px;line-height:1.4;color:var(--muted);border:2px solid transparent}
.cc small{display:block;font-size:11.5px;font-weight:700}
.cc.on{color:var(--ok);border-color:color-mix(in srgb,#22c55e 50%,transparent);background:color-mix(in srgb,#22c55e 10%,var(--card))}
.cc.on.gold{color:#a16207;border-color:color-mix(in srgb,#f59e0b 55%,transparent);background:color-mix(in srgb,#f59e0b 12%,var(--card))}
.cc.on.star{color:#7e22ce;border-color:color-mix(in srgb,#a855f7 55%,transparent);background:color-mix(in srgb,#a855f7 12%,var(--card))}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dg{padding:12px;border-radius:16px;background:color-mix(in srgb,#8b5cf6 10%,var(--bg));text-align:center}
.dg small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.dg b{font-size:26px;font-weight:900;line-height:1.3;color:#6d28d9}
.rem{display:flex;gap:8px}
.rem div{flex:1;text-align:center;padding:12px;border-radius:16px;background:var(--bg)}
.rem b{display:block;font-size:24px;font-weight:900;line-height:1.3}
.rem small{color:var(--muted);font-weight:700;font-size:12.5px}
.seg{display:flex;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:calc(env(safe-area-inset-top,0px) + 14px) 0 12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:800;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.lbh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font-weight:800}
.lbh small{color:var(--muted);font-size:12.5px;font-weight:700}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.lbr.me{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card));padding:9px 11px}
.rk{width:40px;height:40px;flex:none;position:relative;display:grid;place-items:center;font-weight:900;color:var(--muted);font-size:15px}
.rk svg{position:absolute;inset:0;width:40px;height:40px}
.rk i{position:relative;font-style:normal;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.lbr .nm{flex:1;min-width:0;font-weight:800;font-size:14.5px;line-height:1.35}
.lbr .nm small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.lbr .sc{text-align:left;font-weight:900;font-size:16px;line-height:1.3}
.lbr .sc small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.myrank{margin:4px 0 10px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--ac) 14%,var(--card));text-align:center;font-weight:800;color:var(--ac)}
.more{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-weight:700}
.empty .btn{margin-top:16px}
@media (prefers-reduced-motion:reduce){.chip.dx.pulse,.st-current::after,.node.pulse::after,.gbtn.hl,.flash .node,.spin{animation:none}.sheet{animation:none}}

.catch(function(e){console.error('Data refresh error:',e)})}
function initialRefresh(s){
fetch(SCRIPT_URL+'?action=getStudentData&studentId='+encodeURIComponent(s.id)+'&classId='+encodeURIComponent(s.classIdentifier)+'&t='+Date.now(),{redirect:'follow'})
.then(function(r){return r.json()}).then(function(res){
if(res.status==='success'&&res.data){res.data.classIdentifier=getClassIdentifier(res.data.class);if(s.role)res.data.role=s.role;student=res.data;localStorage.setItem('currentStudent',JSON.stringify(student));enter()}
else throw new Error(res.message||'Failed to refresh student data.')})
.catch(function(e){console.error('Data refresh error:',e);localStorage.removeItem('currentStudent');student=null;showLogin()})}
function handleLogin(id){
var err=$('login-err'),btn=$('login-btn'),txt=$('login-txt');
btn.disabled=true;txt.textContent='جاري الدخول...';err.hidden=true;
fetch(SCRIPT_URL+'?action=findStudentById&studentId='+encodeURIComponent(id),{redirect:'follow'})
.then(function(r){return r.json()}).then(function(res){
if(res.status==='success'&&res.data){
res.data.classIdentifier=getClassIdentifier(res.data.class);
if(!res.data.classIdentifier&&res.data.role!=='teacher'){err.textContent='خطأ: لم يتم التعرف على صيغة الفصل للطالب.';err.hidden=false;return}
student=res.data;localStorage.setItem('currentStudent',JSON.stringify(student));chapterChosen=false;enter();if(student.classIdentifier)refresh(true)}
else{err.textContent=res.message||'رقم الهوية غير مسجل في أي فصل.';err.hidden=false}})
.catch(function(e){console.error('Login Error:',e);err.textContent='خطأ في الاتصال بالخادم. يرجى المحاولة مرة أخرى.';err.hidden=false})
.then(function(){btn.disabled=false;txt.textContent='دخول'})}
function logout(){localStorage.removeItem('currentStudent');window.location.reload()}

document.addEventListener('click',function(e){
var t=e.target;
var c=t.closest('[data-c]');if(c){curCh=+c.getAttribute('data-c');renderHome();renderDock();var h=$('hero');if(h)h.scrollIntoView({behavior:'smooth',block:'start'});return}
var a=t.closest('[data-act]');
if(a){var act=a.getAttribute('data-act');
if(act==='logout'){logout();return}
if(act==='login'){closeSheet();localStorage.removeItem('currentStudent');student=null;$('login-err').hidden=true;showLogin();return}
if(act==='diag'){openDiag();return}
if(act==='diagsheet'){openDiagSheet();return}
if(act==='oldest'){var mu=musaid();if(mu.secondaryTask)goTo(mu.secondaryTask);return}
if(act==='lbretry'){lbErr=false;renderLB();return}
if(act==='lbmore'){lbAll=!lbAll;renderLB();return}
if(act==='closegame'){closeGame();return}}
var tab=t.closest('[data-tab]');if(tab){setView(tab.getAttribute('data-tab'));return}
var lt=t.closest('[data-lbt]');if(lt){lbTab=+lt.getAttribute('data-lbt');lbAll=false;renderLB();return}
var pg=t.closest('[data-pg]');if(pg){playGame(pg.getAttribute('data-l'),+pg.getAttribute('data-pg'));return}
var go=t.closest('[data-go]');if(go){openLesson(go.getAttribute('data-go'));return}
var st=t.closest('[data-start]');if(st){closeSheet();openLesson(st.getAttribute('data-start'));return}
var pl=t.closest('[data-play]');if(pl){playGame(sheetLesson,+pl.getAttribute('data-play'));return}
var g=t.closest('.gb[data-g]');if(g){playGame(g.getAttribute('data-l'),+g.getAttribute('data-g'));return}
var k=t.closest('#rows [data-k]');if(k){var kk=k.getAttribute('data-k');
if(kk==='diag')openDiagSheet();
else if(kk==='next'){curCh=Math.min(KEYS.length-1,curCh+1);renderHome();renderDock();window.scrollTo({top:0,behavior:'smooth'})}
else if(kk==='me')setView('me');
return}
var l=t.closest('#rows [data-l]');if(l){openLessonSheet(l.getAttribute('data-l'));return}
if(t.id==='ov')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('gm').hidden)closeGame();else closeSheet()}});
window.addEventListener('resize',draw);
window.addEventListener('message',function(ev){
if(ev.data&&ev.data.event==='gameFinished'){
if(!student&&ev.data.gameId){var at=JSON.parse(localStorage.getItem('visitorGameAttempts')||'{}');at[ev.data.gameId]=(at[ev.data.gameId]||0)+1;localStorage.setItem('visitorGameAttempts',JSON.stringify(at))}
closeGame()}});
$('login-form').addEventListener('submit',function(e){e.preventDefault();var v=$('login-id').value.trim();if(v)handleLogin(v)});
$('visitor-btn').addEventListener('click',function(){localStorage.removeItem('currentStudent');student=null;chapterChosen=false;enter()});
$('logo').innerHTML=ic('game',40,2);
$('gm-x').innerHTML=ic('x',22);
(function init(){
var s=getStored();
if(s&&s.id&&s.classIdentifier)initialRefresh(s);
else showLogin();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw)})();
})();
</script>
</body>
</html>
