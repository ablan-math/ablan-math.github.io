<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحدي الحوادث المستقلة وغير المستقلة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; touch-action: manipulation; direction: rtl; }
        .compact-card { width: 100%; max-width: 420px; background: white; border-radius: 2rem; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; display: flex; flex-direction: column; max-height: 96vh; overflow: hidden; position: relative; }
        .top-info-bar { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; color: #64748b; }
        .btn-touch { min-height: 50px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; border-radius: 1rem; font-weight: 800; cursor: pointer; }
        .btn-touch:active { transform: scale(0.97); }
        .leaderboard-modal { position: absolute; inset: 0; background: #ffffff; z-index: 100; display: flex; flex-direction: column; padding: 1.25rem; transition: all 0.3s; }
        .hidden-modal { opacity: 0; pointer-events: none; transform: scale(0.95); display: none; }
        .visible-modal { opacity: 1; pointer-events: auto; transform: scale(1); display: flex; }
        .tab-btn { flex: 1; padding: 8px; font-size: 11px; font-weight: bold; border-radius: 8px; transition: 0.3s; border: 1px solid transparent; cursor: pointer; }
        .tab-active { background-color: #3b82f6; color: white; box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4); }
        .tab-inactive { background-color: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
        .rank-row-me { background-color: #eff6ff !important; border-right: 4px solid #2563eb !important; }
        .sync-loader { font-size: 10px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .leaderboard-name { color: #1e293b; font-weight: 800; font-size: 11px; }
        .leaderboard-rank { font-weight: 900; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 50% { transform: translateX(5px) rotate(2deg); } 75% { transform: translateX(-5px) rotate(-2deg); } }
        .shake-err { animation: shake 0.4s ease-in-out; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; display: none; } }
        .pop-out { animation: pop 0.5s forwards; }
        
        /* التأثيرات البصرية الخاصة بالإرجاع وعدم الإرجاع */
        .consumed-item { filter: grayscale(100%) opacity(30%); transition: all 0.8s ease; display: inline-block; }
        .replaced-container { position: relative; display: inline-block; }
        .sync-icon-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #3b82f6; font-size: 1.5rem; opacity: 0; animation: sync-spin 1.2s forwards ease-in-out; text-shadow: 0px 0px 4px white; pointer-events: none; }
        @keyframes sync-spin { 0% { transform: translate(-50%, -50%) rotate(-180deg) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); opacity: 0.9; } }
        
        .game-btn { transition: all 0.2s; }
        .game-btn:hover { transform: translateY(-2px); }
        .game-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen flex items-center justify-center p-3 text-right">
    <div class="compact-card">
        <!-- Top bar -->
        <div class="top-info-bar">
            <div class="flex items-center gap-2 overflow-hidden">

            </div>
            <div class="flex items-center gap-2 bg-white px-2 py-0.5 rounded-full border shadow-sm font-bold">

                <i class="fas fa-clock text-blue-500 text-[10px]"></i>
                <span id="game-timer">٠٠:٠٠</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="p-6 text-center flex flex-col gap-4 h-full justify-center">

            <h1 class="text-2xl font-black text-slate-800">تحدي الحوادث:<br> مستقلة أم غير مستقلة؟</h1>
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 text-xs font-bold text-blue-700 leading-relaxed text-center shadow-inner">
                أهلاً بك يا بطل!<br>أنت محتجز في مختبر الاحتمالات. لفتح الأبواب، يجب عليك حل كل مهمة عبر ٣ خطوات: حدد النوع، اكتب التعبير، ثم احسب الناتج!
            </div>
            
            <div class="flex flex-row gap-2 items-stretch mt-4">
                <button onclick="startInteractiveGame()" class="btn-touch flex-[2.5] bg-blue-600 text-white shadow-lg text-lg border-b-4 border-blue-800 active:border-b-0 mt-2">
                    بدء المهمة <i class="fas fa-door-open mr-2"></i>
                </button>
                <button onclick="fetchAndShowLeaderboard(true)" class="btn-touch flex-1 bg-white text-slate-600 border border-slate-200 text-[10px] flex-col leading-tight py-2 mt-2">
                    <i class="fas fa-trophy text-yellow-500 text-xl mb-1"></i>
                    <span>سجل الأبطال</span>
                </button>
            </div>
            
            <!-- إضافة اسم المعلم هنا -->
            <p class="text-[10px] text-slate-400 font-bold mt-3 tracking-widest uppercase text-center">أ. عبد العزيز خالد العبلان</p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden p-4 flex flex-col h-full overflow-hidden text-center relative">
            
            <!-- Progress -->
            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-3">
              <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div id="question-container" class="flex-1 flex flex-col items-center justify-start overflow-y-auto pb-4">
                <div class="flex justify-between items-center w-full border-b-2 border-blue-200 pb-1 mb-2">
                    <h2 id="q-title" class="text-lg font-black text-blue-800"></h2>
                    <span class="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded-full"><span id="score-display">٠</span> نقطة</span>
                </div>
                
                <!-- Visual Area -->
                <div class="w-full mb-3">
                    <button onclick="toggleVisual()" class="w-full flex items-center justify-center gap-2 text-xs font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-lg p-2 transition-colors hover:bg-blue-100 outline-none">
                        <span id="toggle-text">إخفاء المحتويات البصرية</span>
                        <i id="toggle-icon" class="fas fa-chevron-up"></i>
                    </button>
                    <div id="visual-area" class="w-full mt-2 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-3 min-h-[70px] flex flex-wrap justify-center gap-1 text-2xl transition-all duration-300">
                    </div>
                </div>

                <p id="q-text" class="text-xs font-bold text-slate-700 leading-relaxed mb-4 bg-white p-3 rounded-xl shadow-sm border border-slate-100"></p>

                <!-- Step 1: Type Section -->
                <div id="type-section" class="w-full">
                    <p class="text-[11px] text-slate-500 font-bold mb-2">الخطوة ١: حدد نوع الحادثتين (نقطة واحدة)</p>
                    <div class="flex gap-2">
                        <button onclick="checkType('independent', this)" class="game-btn flex-1 py-3 rounded-xl border-2 border-blue-400 bg-white text-blue-600 font-black shadow-sm">
                            مستقلتان
                        </button>
                        <button onclick="checkType('dependent', this)" class="game-btn flex-1 py-3 rounded-xl border-2 border-purple-400 bg-white text-purple-600 font-black shadow-sm">
                            غير مستقلتين
                        </button>
                    </div>
                </div>

                <!-- Explanation / Transition Text -->
                <p id="explanation-text" class="text-[10px] text-emerald-600 font-bold mb-3 p-2 bg-emerald-50 rounded-lg hidden w-full"></p>

                <!-- Step 2: Expression Section -->
                <div id="expr-section" class="w-full hidden">
                    <p class="text-[11px] text-slate-500 font-bold mb-2" id="expr-q-text"></p>
                    <div id="expr-grid" class="grid grid-cols-2 gap-2">
                    </div>
                </div>

                <!-- Step 3: Math Section -->
                <div id="math-section" class="w-full hidden mt-4">
                    <div class="text-[11px] text-slate-500 font-bold mb-2" id="math-q-text"></div>
                    <div id="math-grid" class="grid grid-cols-2 gap-2">
                    </div>
                    
                    <!-- منطقة التغذية الراجعة الرياضية وزر الانتقال -->
                    <div id="math-feedback-area" class="hidden w-full mt-4 flex flex-col items-center gap-3">
                        <p id="math-explanation-text" class="text-[11px] font-bold p-3 rounded-lg w-full text-center leading-relaxed"></p>
                        <button id="next-q-btn" onclick="nextQuestion()" class="btn-touch bg-blue-600 text-white w-full shadow-md text-sm py-3 mt-1 transition-colors">
                            السؤال التالي <i class="fas fa-arrow-left mr-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Hidden Inputs for the Template Logic -->
            <input type="hidden" id="input-achieved" value="0">
            <input type="hidden" id="input-max" value="20"> <!-- 4 questions * 5 points max each -->
            <input type="hidden" id="input-metric-value" value="0">
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-5 flex flex-col h-full overflow-hidden text-center justify-center">
            <div class="text-6xl mb-4 text-emerald-500 drop-shadow-md">🎉</div>
            <h2 class="text-2xl font-black text-slate-800 mb-4">اكتملت المهمات!</h2>
            <div id="final-stats" class="grid grid-cols-3 gap-2 mb-6"></div>
            <button onclick="fetchAndShowLeaderboard(true)" class="btn-touch w-full bg-blue-600 text-white mb-4 shadow-md text-lg">
                <i class="fas fa-crown ml-2"></i> سجل الأبطال
            </button>
            <div class="mt-auto flex gap-2">
                <button onclick="location.reload()" class="btn-touch flex-1 bg-slate-100 text-slate-600 text-sm font-bold">إعادة التحدي</button>
                <button id="finish-btn" class="btn-touch flex-[2] bg-slate-900 text-white text-sm font-bold">إنهاء</button>
            </div>
        </div>

        <!-- Leaderboard -->

            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h3 class="font-black text-slate-800 text-lg"><i class="fas fa-trophy text-yellow-500 ml-2"></i>سجل المتصدرين</h3>
                <button onclick="closeLeaderboardModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center transition-all hover:bg-red-50 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex gap-2 mb-4">
                <button onclick="switchTab('class')" id="tab-class" class="tab-btn tab-inactive">أبطال فصلي</button>

            </div>
            <div id="modal-body" class="flex-1 overflow-y-auto bg-slate-50 rounded-2xl border border-slate-100 p-1 relative">

            </div>
        </div>
    </div>

                text: 'ثلاجة تحوي ٧ عصائر تفاح، و ٥ برتقال (المجموع ١٢). اشترى أحمد عصير برتقال (وأخذه)، ثم اشترى صديقه عصير تفاح.',
                type: 'dependent',
                visual: '🍎x٧ (تفاح) &nbsp;&nbsp;&nbsp; 🍊x٥ (برتقال)',
                targetEmoji: '🍊',
                actionType: 'consume',
                explanation: 'أخذ العصير يقلل العدد الكلي للعصائر في الثلاجة من ١٢ إلى ١١ (بدون إرجاع).',
                exprQuestion: 'الخطوة ٢: ما هو التعبير الرياضي لاحتمال (برتقال ثم تفاح)؟',
                exprOptions: ['5/12 * 7/12', '5/12 * 7/11', '7/12 * 5/11', '1/12 * 1/11'],
                correctExpr: 1,
                mathQuestion: 'الخطوة ٣: ما هو ناتج الضرب في أبسط صورة؟',
                mathOptions: ['35 / 132', '12 / 23', '35 / 144', '7 / 132'],
                correctMath: 0,
                mathExplanation: 'الضرب المباشر للبسط (٥ × ٧ = ٣٥) والمقام (١٢ × ١١ = ١٣٢). الكسر ٣٥/١٣٢ في أبسط صورة.'
            },
            {
                title: 'التجربة المزدوجة 🎡🎲',
                text: 'قرص دوار مقسم لـ ٤ ألوان متساوية (أحمر، أزرق، أخضر، أصفر)، ومكعب أرقام (١-٦). تم تدوير القرص ورمي المكعب.',
                type: 'independent',
                visual: '🎡 <span class="mx-4 text-slate-300">|</span> 🎲',
                targetEmoji: '🎡',
                actionType: 'replace',
                explanation: 'نتيجة القرص لا يمكن أن تؤثر أبداً على نتيجة مكعب الأرقام فكل منهما في فضاء مستقل.',
                exprQuestion: 'الخطوة ٢: ما التعبير الرياضي لاحتمال (لون أحمر) و (رقم ٣)؟',
                exprOptions: ['1/4 * 1/6', '1/4 * 3/6', '4/10 * 6/10', '1/4 * 1/5'],
                correctExpr: 0,
                mathQuestion: 'الخطوة ٣: ما هو ناتج الضرب في أبسط صورة؟',
                mathOptions: ['2 / 10', '1 / 24', '1 / 10', '3 / 24'],
                correctMath: 1,
                mathExplanation: 'احتمال الأحمر هو ١/٤، واحتمال رقم محدد كالثلاثة هو ١/٦. نضرب البسطين (١×١=١) والمقامين (٤×٦=٢٤).'
            }
        ];
        
        let questions = []; // سيتم ملؤها بـ 4 أسئلة عشوائية من البنك في كل مرة

        // دالة لخلط المصفوفة (عشوائية)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('top-student-name').textContent = studentName;
            if (!classId) {
                document.getElementById('tab-class').style.display = 'none';
                currentLeaderboardMode = 'global';
            } else {
                document.getElementById('tab-class').className = 'tab-btn tab-active';
                document.getElementById('tab-global').className = 'tab-btn tab-inactive';
            }
            if (!urlParams.get('name') && !studentId) {
                studentName = "بطل زائر";
                document.getElementById('top-student-name').textContent = studentName;
            }
            document.getElementById('finish-btn').onclick = () => window.parent.postMessage({ event: 'gameFinished', gameId: GAME_ID }, '*');
        });

        window.toggleVisual = () => {
            const vArea = document.getElementById('visual-area');
            const icon = document.getElementById('toggle-icon');
            const text = document.getElementById('toggle-text');
            if (vArea.classList.contains('hidden')) {
                vArea.classList.remove('hidden');
                icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
                text.textContent = 'إخفاء المحتويات البصرية';
            } else {
                vArea.classList.add('hidden');
                icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
                text.textContent = 'عرض المحتويات بصرياً';
            }
        };

        window.startInteractiveGame = () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // سحب 4 أسئلة عشوائية من البنك في كل مرة يبدأ فيها التحدي
            questions = shuffleArray([...questionBank]).slice(0, 4);
            
            gameScore = 0;
            currentQIndex = 0;
            timeElapsed = 0;
            startTimer();
            loadQuestion(0);
        };

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = toAr(gameScore);
        }

        function loadQuestion(index) {
            if (index >= questions.length) { endGame(); return; }
            const q = questions[index];
            updateScoreDisplay();
            
            document.getElementById('q-title').textContent = q.title;
            document.getElementById('q-text').textContent = q.text;
            document.getElementById('visual-area').innerHTML = q.visual;
            
            // Show only Step 1
            document.getElementById('type-section').classList.remove('hidden');
            document.getElementById('expr-section').classList.add('hidden');
            document.getElementById('math-section').classList.add('hidden');
            document.getElementById('explanation-text').classList.add('hidden');
            document.getElementById('math-feedback-area').classList.add('hidden');
            
            // Visual Area Setup
            const vArea = document.getElementById('visual-area');
            vArea.classList.remove('hidden', 'border-emerald-500', 'border-red-500', 'bg-emerald-50', 'bg-red-50');
            vArea.className = "w-full mt-2 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-3 min-h-[70px] flex flex-wrap justify-center gap-1 text-2xl transition-all duration-300";
            document.getElementById('toggle-icon').className = 'fas fa-chevron-up';
            document.getElementById('toggle-text').textContent = 'إخفاء المحتويات البصرية';
            
            // Reset Step 1 Buttons
            document.getElementById('type-section').classList.remove('pointer-events-none');
            const typeBtns = document.querySelectorAll('#type-section button');
            typeBtns.forEach(btn => {
                btn.className = btn.className.replace(/bg-(red|emerald)-100/g, 'bg-white').replace(/border-(red|emerald)-500/g, btn.classList.contains('text-blue-600') ? 'border-blue-400' : 'border-purple-400');
            });

            const progress = (index / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // --- الخطوة 1: فحص النوع ---
        window.checkType = (selectedType, btnElement) => {
            const typeSection = document.getElementById('type-section');
            if(typeSection.classList.contains('pointer-events-none')) return;
            typeSection.classList.add('pointer-events-none');

            const q = questions[currentQIndex];
            const isCorrect = (selectedType === q.type);

            if (isCorrect) {
                gameScore += 1; 
                updateScoreDisplay();
                btnElement.classList.replace('bg-white', 'bg-emerald-100');
                btnElement.classList.remove('border-blue-400', 'border-purple-400');
                btnElement.classList.add('border-emerald-500');
            } else {
                btnElement.classList.replace('bg-white', 'bg-red-100');
                btnElement.classList.remove('border-blue-400', 'border-purple-400');
                btnElement.classList.add('border-red-500');
                const container = document.getElementById('question-container');
                container.classList.remove('shake-err');
                void container.offsetWidth;
                container.classList.add('shake-err');
            }
            
            const vArea = document.getElementById('visual-area');
            vArea.classList.remove('border-emerald-500', 'border-red-500', 'bg-emerald-50', 'bg-red-50');
            vArea.classList.add(isCorrect ? 'border-emerald-500' : 'border-red-500', isCorrect ? 'bg-emerald-50' : 'bg-red-50');
            
            let visualHtml = q.visual;
            if (q.actionType === 'consume') {
                visualHtml = visualHtml.replace(q.targetEmoji, `<span class="consumed-item">${q.targetEmoji}</span>`);
            } else if (q.actionType === 'replace') {
                visualHtml = visualHtml.replace(q.targetEmoji, `<span class="replaced-container">${q.targetEmoji}<i class="fas fa-sync-alt sync-icon-overlay"></i></span>`);
            }
            vArea.innerHTML = visualHtml;

            // Transition to Step 2 (Expression)
            setTimeout(() => {
                document.getElementById('type-section').classList.add('hidden');
                setTimeout(() => { if(!vArea.classList.contains('hidden')) toggleVisual(); }, 800); 
                
                const expBox = document.getElementById('explanation-text');
                expBox.classList.remove('hidden', 'text-emerald-600', 'text-red-600', 'bg-emerald-50', 'bg-red-50');
                expBox.classList.add(isCorrect ? 'text-emerald-600' : 'text-red-600', isCorrect ? 'bg-emerald-50' : 'bg-red-50');
                const expTitle = isCorrect ? 'أحسنت!' : 'التصحيح:';
                const expIcon = isCorrect ? 'fa-check-circle' : 'fa-times-circle';
                expBox.innerHTML = `<i class="fas ${expIcon} ml-1"></i> <strong>${expTitle}</strong> <span class="text-slate-600">${q.explanation}</span>`;
                
                loadExprSection(q);
            }, 1200);
        };

        // --- الخطوة 2: فحص التعبير الرياضي ---
        function loadExprSection(q) {
            currentAttempts = 0; // Reset attempts for this step
            document.getElementById('expr-section').classList.remove('hidden');
            document.getElementById('expr-q-text').textContent = q.exprQuestion;
            
            const grid = document.getElementById('expr-grid');
            grid.innerHTML = '';
            
            q.exprOptions.forEach((opt, idx) => {
                const parts = opt.split('*');
                const f1 = parts[0].trim().split('/');
                const f2 = parts[1].trim().split('/');
                const num1 = toAr(f1[0]), den1 = toAr(f1[1]);
                const num2 = toAr(f2[0]), den2 = toAr(f2[1]);

                grid.innerHTML += `
                <button id="expr-btn-${idx}" onclick="checkExpr(${idx}, this)" class="game-btn py-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-bold shadow-sm hover:bg-slate-50 hover:border-slate-400 flex items-center justify-center transition-all duration-300 gap-2" dir="ltr">
                    <div class="flex flex-col items-center leading-none pointer-events-none text-[10px]">
                        <span class="border-b-2 border-slate-400 px-2 pb-0.5 mb-0.5">${num1}</span>
                        <span>${den1}</span>
                    </div>
                    <span class="text-blue-500 font-black pointer-events-none text-sm">×</span>
                    <div class="flex flex-col items-center leading-none pointer-events-none text-[10px]">
                        <span class="border-b-2 border-slate-400 px-2 pb-0.5 mb-0.5">${num2}</span>
                        <span>${den2}</span>
                    </div>
                </button>`;
            });
        }

        window.checkExpr = (selectedIndex, btnElement) => {
            if(btnElement.disabled) return;
            const q = questions[currentQIndex];

            if (selectedIndex === q.correctExpr) {
                if (currentAttempts === 0) gameScore += 2;
                else if (currentAttempts === 1) gameScore += 1;
                updateScoreDisplay();

                btnElement.classList.replace('border-slate-200', 'border-emerald-500');
                btnElement.classList.replace('bg-white', 'bg-emerald-100');
                
                document.querySelectorAll('#expr-grid button').forEach(b => b.disabled = true);
                
                // Show Success message in explanation box
                const expBox = document.getElementById('explanation-text');
                expBox.classList.remove('text-red-600', 'bg-red-50');
                expBox.classList.add('text-emerald-600', 'bg-emerald-50');
                expBox.innerHTML = `<i class="fas fa-check-circle ml-1"></i> تعبير رياضي صحيح! استمر..`;

                setTimeout(() => { loadMathSection(q); }, 1000);
            } else {
                currentAttempts++;
                const container = document.getElementById('question-container');
                container.classList.remove('shake-err');
                void container.offsetWidth; 
                container.classList.add('shake-err');

                if (currentAttempts === 1) {
                    btnElement.classList.add('opacity-0', 'pointer-events-none');
                    btnElement.disabled = true;
                } else {
                    btnElement.classList.replace('border-slate-200', 'border-red-500');
                    btnElement.classList.replace('bg-white', 'bg-red-100');
                    const correctBtn = document.getElementById(`expr-btn-${q.correctExpr}`);
                    if(correctBtn) {
                        correctBtn.classList.replace('border-slate-200', 'border-emerald-500');
                        correctBtn.classList.replace('bg-white', 'bg-emerald-100');
                    }
                    document.querySelectorAll('#expr-grid button').forEach(b => b.disabled = true);
                    setTimeout(() => { loadMathSection(q); }, 2000);
                }
            }
        };

        // --- الخطوة 3: فحص الحساب النهائي ---
        function loadMathSection(q) {
            currentAttempts = 0; // Reset attempts for Math step
            document.getElementById('expr-section').classList.add('hidden');
            document.getElementById('math-section').classList.remove('hidden');
            
            // جلب التعبير الصحيح الذي تمت الإجابة عليه في الخطوة السابقة وتحويله بصرياً
            const correctExprText = q.exprOptions[q.correctExpr];
            const exprParts = correctExprText.split('*');
            const f1 = exprParts[0].trim().split('/');
            const f2 = exprParts[1].trim().split('/');
            const num1 = toAr(f1[0]), den1 = toAr(f1[1]);
            const num2 = toAr(f2[0]), den2 = toAr(f2[1]);
            
            document.getElementById('math-q-text').innerHTML = `
                <div class="mb-2 text-center text-xs">${q.mathQuestion}</div>
                <div class="flex items-center justify-center gap-3 mt-2 mb-3 text-sm text-slate-700 bg-white shadow-sm p-3 rounded-xl border border-slate-100 w-fit mx-auto" dir="ltr">
                    <div class="flex flex-col items-center leading-none">
                        <span class="border-b-2 border-slate-300 px-3 pb-1 mb-1">${num1}</span>
                        <span>${den1}</span>
                    </div>
                    <span class="text-blue-500 font-black">×</span>
                    <div class="flex flex-col items-center leading-none">
                        <span class="border-b-2 border-slate-300 px-3 pb-1 mb-1">${num2}</span>
                        <span>${den2}</span>
                    </div>
                    <span class="text-slate-400 font-black ml-2">= ؟</span>
                </div>
            `;
            
            const grid = document.getElementById('math-grid');
            grid.innerHTML = '';
            
            q.mathOptions.forEach((opt, idx) => {
                const parts = opt.split('/');
                const num = toAr(parts[0].trim());
                const den = toAr(parts[1].trim());
                grid.innerHTML += `
                <button id="math-btn-${idx}" onclick="checkMath(${idx}, this)" class="game-btn py-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-bold shadow-sm hover:bg-slate-50 hover:border-slate-400 text-lg flex items-center justify-center transition-all duration-300">
                    <div class="flex flex-col items-center leading-none pointer-events-none">
                        <span class="border-b-2 border-slate-400 px-4 pb-1 mb-1">${num}</span>
                        <span>${den}</span>
                    </div>
                </button>`;
            });
        }

        function showMathFeedback(isCorrect) {
            stopTimer(); // إيقاف الزمن ليتيح للطالب القراءة
            const q = questions[currentQIndex];
            const feedbackArea = document.getElementById('math-feedback-area');
            const feedbackText = document.getElementById('math-explanation-text');
            const nextBtn = document.getElementById('next-q-btn');

            feedbackArea.classList.remove('hidden');

            if (isCorrect) {
                feedbackText.className = "text-[11px] font-bold p-3 rounded-lg w-full text-center bg-emerald-50 text-emerald-700 border border-emerald-200 leading-relaxed";
                feedbackText.innerHTML = `<i class="fas fa-check-circle ml-1"></i> <strong>إجابة صحيحة!</strong><br>${q.mathExplanation}`;
            } else {
                feedbackText.className = "text-[11px] font-bold p-3 rounded-lg w-full text-center bg-red-50 text-red-700 border border-red-200 leading-relaxed";
                feedbackText.innerHTML = `<i class="fas fa-times-circle ml-1"></i> <strong>الخطوة الصحيحة:</strong><br>${q.mathExplanation}`;
            }

            // التحقق مما إذا كان هذا هو السؤال الأخير لتغيير شكل الزر
            if (currentQIndex === questions.length - 1) {
                nextBtn.innerHTML = `إنهاء المهمة واعتماد النتيجة <i class="fas fa-flag-checkered mr-2"></i>`;
                nextBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
            } else {
                nextBtn.innerHTML = `السؤال التالي <i class="fas fa-arrow-left mr-2"></i>`;
                nextBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
            }
        }

        window.nextQuestion = () => {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                startTimer(); // إعادة تشغيل الزمن
                loadQuestion(currentQIndex);
            } else {
                endGame();
            }
        };

        window.checkMath = (selectedIndex, btnElement) => {
            if(btnElement.disabled) return;
            const q = questions[currentQIndex];

            if (selectedIndex === q.correctMath) {
                if (currentAttempts === 0) gameScore += 2;
                else if (currentAttempts === 1) gameScore += 1;
                updateScoreDisplay();

                btnElement.classList.replace('border-slate-200', 'border-emerald-500');
                btnElement.classList.replace('bg-white', 'bg-emerald-100');
                btnElement.classList.add('text-emerald-700');

                document.querySelectorAll('#math-grid button').forEach(b => b.disabled = true);
                showMathFeedback(true);
            } else {
                currentAttempts++;
                const container = document.getElementById('question-container');
                container.classList.remove('shake-err');
                void container.offsetWidth; 
                container.classList.add('shake-err');

                if (currentAttempts === 1) {
                    btnElement.classList.add('opacity-0', 'pointer-events-none');
                    btnElement.disabled = true;
                } else {
                    btnElement.classList.replace('border-slate-200', 'border-red-500');
                    btnElement.classList.replace('bg-white', 'bg-red-100');
                    
                    const correctBtn = document.getElementById(`math-btn-${q.correctMath}`);
                    if(correctBtn) {
                        correctBtn.classList.replace('border-slate-200', 'border-emerald-500');
                        correctBtn.classList.replace('bg-white', 'bg-emerald-100');
                    }

                    document.querySelectorAll('#math-grid button').forEach(b => b.disabled = true);
                    showMathFeedback(false);
                }
            }
        };

        function endGame() {
            stopTimer(); // تأكيد إيقاف الزمن عند الإنهاء
            document.getElementById('input-achieved').value = gameScore;
            document.getElementById('input-max').value = 20;
            document.getElementById('input-metric-value').value = timeElapsed;
            processResults();
        }

        window.processResults = () => {
            const ach = parseFloat(document.getElementById('input-achieved').value);
            const max = parseFloat(document.getElementById('input-max').value);
            const met = parseFloat(document.getElementById('input-metric-value').value) || 0;
            
            // تحويل الدرجة لتكون من 5 للمنصة
            const grade = ((ach / max) * 5).toFixed(1);
            showResultScreen(ach, max, grade, met);
            
            if (studentId && classId) saveScore(grade, met);
            else { 
                localVisitorResult = { name: studentName, grade: grade, metric: met, isLocal: true }; 
                fetchAndShowLeaderboard(false); 
            }
        };

        function showResultScreen(a, m, g, met) {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const min = Math.floor(met / 60);
            const sec = met % 60;
            const timeStr = `${min}:${sec.toString().padStart(2, '0')}`;
            document.getElementById('final-stats').innerHTML = `
                <div class="bg-blue-50 p-2 rounded-2xl border border-blue-100 text-center flex flex-col justify-center">
                    <p class="text-[9px] font-bold text-blue-500 mb-1">النقاط المكتسبة</p>
                    <p class="text-xl font-black text-blue-900">${toAr(a)} / ${toAr(m)}</p>
                </div>
                <div class="bg-emerald-50 p-2 rounded-2xl border border-emerald-100 text-center flex flex-col justify-center shadow-md transform scale-110 z-10">
                    <p class="text-[10px] font-bold text-emerald-600 mb-1">الدرجة النهائية</p>
                    <p class="text-3xl font-black text-emerald-600">${toAr(g)} <span class="text-xs text-emerald-500">/ ٥</span></p>
                </div>
                <div class="bg-purple-50 p-2 rounded-2xl border border-purple-100 text-center flex flex-col justify-center">
                    <p class="text-[9px] font-bold text-purple-500 mb-1">الزمن المستغرق</p>
                    <p class="text-xl font-black text-purple-900">${toAr(timeStr)}</p>
                </div>
            `;
        }

        async function saveScore(g, met) {
            const p = new URLSearchParams({ action: 'saveScore', studentId, classId, itemId: GAME_ID, score: g, metricValue: met, type: 'game' });
            try { await fetch(`${SCRIPT_URL}?${p.toString()}`); } catch(e){} finally { fetchAndShowLeaderboard(false); }
        }

        window.fetchAndShowLeaderboard = function(isManual = false) {
            const modal = document.getElementById('leaderboard-modal');
            if (isManual) { modal.classList.remove('hidden-modal'); modal.classList.add('visible-modal'); }
            const content = document.getElementById('leaderboard-content');
            document.getElementById('modal-loader').classList.remove('hidden');
            let reqClassId = (currentLeaderboardMode === 'class') ? classId : 'all';
            const url = `${SCRIPT_URL}?action=getLeaderboard&gameId=${GAME_ID}&classId=${encodeURIComponent(reqClassId || 'all')}&t=${Date.now()}`;
            
            fetch(url).then(r => r.json()).then(res => {
                let data = (res.status === 'success' && res.data) ? res.data : [];
                if (localVisitorResult && (currentLeaderboardMode === 'global' || !classId)) {
                    if (!data.find(p => p.name === localVisitorResult.name)) data.push(localVisitorResult);
                    data.sort((a, b) => parseFloat(b.grade) - parseFloat(a.grade) || parseFloat(a.metric) - parseFloat(b.metric));
                }
                if (data.length > 0) {
                    let h = `<table class="w-full text-right text-[10px] border-collapse"><thead class="text-slate-400 border-b border-slate-100 bg-slate-50/50"><tr><th class="p-2 text-center">#</th><th class="p-2 text-right">البطل</th><th class="p-2 text-center">الدرجة (الزمن)</th></tr></thead><tbody class="divide-y divide-slate-50">`;
                    data.forEach((p, i) => {
                        const isMe = (p.isLocal || (studentId && String(p.name).trim() === String(studentName).trim()));
                        const timeFormatted = toAr(`${Math.floor(p.metric/60)}:${(p.metric%60).toString().padStart(2,'0')}`);
                        h += `<tr class="${isMe ? 'rank-row-me' : 'hover:bg-slate-50/50'} transition-colors">
                            <td class="p-2 leaderboard-rank text-center ${i<3 ? 'text-yellow-500 text-sm' : 'text-slate-400'}">${i < 3 ? ['🥇','🥈','🥉'][i] : toAr(i+1)}</td>
                            <td class="p-2 leaderboard-name ${isMe ? 'text-blue-700 font-extrabold' : 'text-slate-700'}">${p.name} ${isMe ? '<span class="bg-blue-600 text-white text-[7px] px-1 rounded-full mx-1">أنت</span>' : ''}</td>
                            <td class="p-2 text-center"><span class="text-emerald-600 font-black">${toAr(parseFloat(p.grade).toFixed(1))}</span> <span class="text-[8px] text-slate-400 block font-bold" dir="ltr">⏱ ${timeFormatted}</span></td>
                        </tr>`;
                    });
                    content.innerHTML = h + `</tbody></table>`;
                } else content.innerHTML = `<div class="py-10 text-center text-slate-400 text-xs italic font-bold">بانتظار تسجيل الأبطال..</div>`;
            }).catch(()=> content.innerHTML = `<div class="py-10 text-center text-red-400 text-xs font-bold">حدث خطأ في جلب السجل.</div>`)
            .finally(() => document.getElementById('modal-loader').classList.add('hidden'));
        };

        window.switchTab = (mode) => { currentLeaderboardMode = mode; document.getElementById('tab-class').className = mode === 'class' ? 'tab-btn tab-active' : 'tab-btn tab-inactive'; document.getElementById('tab-global').className = mode === 'global' ? 'tab-btn tab-active' : 'tab-btn tab-inactive'; fetchAndShowLeaderboard(false); };
        window.closeLeaderboardModal = () => document.getElementById('leaderboard-modal').classList.replace('visible-modal', 'hidden-modal');
    })();
    </script>
</body>
</html>
