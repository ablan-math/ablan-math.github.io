<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رياضيات شامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            background: white; width: 210mm; min-height: 297mm; padding: 15mm;
            margin-bottom: 20px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box; position: relative; display: flex; flex-direction: column;
        }
        .page-content { flex-grow: 1; display: flex; flex-direction: column;}
        .page-footer { 
            text-align: center; font-size: 12px; color: #888; padding-top: 10px;
            display: flex; justify-content: space-between;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: flex;
            justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background-color: white; padding: 30px 40px; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
            width: 450px; max-width: 90%;
        }
        .modal-content h2 { margin: 0 0 20px 0; font-size: 22px; }
        
        #result-modal .result-grid {
            display: grid; grid-template-columns: auto 1fr; gap: 8px 15px;
            text-align: right; margin: 20px 0; align-items: center;
        }
        #result-modal .result-grid strong { font-weight: bold; }
        #result-modal .result-score {
            grid-column: 1 / -1; text-align: center; font-size: 28px; font-weight: bold;
            color: #28a745; margin-top: 10px; border-top: 1px solid #eee; padding-top: 15px;
        }
        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }

        .official-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header-col {
            flex: 1; display: flex; flex-direction: column;
            font-size: 13px; line-height: 1.6; font-weight: bold;
        }
        .header-col p { margin: 0; }
        .header-right { text-align: right; }
        .header-center { display: flex; justify-content: center; align-items: center; }
        .header-left { text-align: left; }
        .logo { width: 100px; height: auto; }
        .student-info-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #ccc; padding: 5px 0 10px 0;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .questions-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .question-block {
            border: 1px solid #e0e0e0; padding: 12px 15px; border-radius: 8px;
            background-color: #fafafa; display: flex; flex-direction: column;
        }
        
        .question-prompt {
            margin: 0 0 12px 0; font-size: 16px; font-weight: bold; line-height: 1.8;
        }
        .question-number {
            background-color: #e9e9e9; padding: 3px 9px;
            border-radius: 5px; margin-left: 8px; display: inline-block;
        }
        .question-title { font-weight: normal; display: inline;}

        .options-container { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 6px; }
        .option {
            background-color: #ffffff; border: 1px solid #ccc; border-radius: 5px; padding: 4px 6px;
            font-size: 13px; flex-grow: 1; white-space: nowrap; display: flex;
            align-items: center; cursor: pointer;
        }
        .option input[type="radio"] { display: none; }
        .option.correct { border-color: #28a745; background-color: #e9f7ec; }
        .option.incorrect { border-color: #dc3545; background-color: #fdeeee; }

        .option-label {
            display: inline-flex; align-items: center; justify-content: center; width: 24px;
            height: 24px; border: 1.5px solid #555; border-radius: 50%;
            font-weight: bold; color: #333; margin-left: 8px; flex-shrink: 0;
        }
        .option input[type="radio"]:checked ~ .option-label {
             background-color: #007bff; color: white;
        }
        .option-text { flex-grow: 1; text-align: center; }
        
        /* منع تفكك المعادلات في سطرين */
        .math-exp {
            display: inline-block;
            white-space: nowrap;
            direction: rtl;
            unicode-bidi: embed;
        }

        /* تنسيق الكسور القياسي (بسط ومقام وخط أفقي) */
        .fraction {
            display: inline-flex; flex-direction: column; vertical-align: middle;
            margin: 0 0.2em; text-align: center; position: relative; top: -0.3em; line-height: 1.2;
        }
        .numerator { padding: 0 0.2em; font-size: 0.9em; }
        .denominator { border-top: 1.5px solid currentColor; padding: 0 0.2em; font-size: 0.9em;}

        /* ARABIC ROOT STYLES */
        .ar-root { display: inline-flex; align-items: center; direction: rtl; vertical-align: middle; margin: 0 2px; }
        .ar-root-sym { transform: scaleX(-1); font-family: Arial, sans-serif; font-size: 1.2em; line-height: 1; font-weight: normal; margin-left: -1px; margin-top: 2px; }
        .ar-root-num { border-top: 1.5px solid currentColor; padding-top: 2px; padding-left: 3px; padding-right: 1px; line-height: 1.1; }

        .controls {
            position: fixed; top: 20px; left: 20px; display: flex;
            flex-direction: column; gap: 10px; z-index: 1000;
        }
        .controls-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            background-color: #007bff; color: white; border: none; padding: 10px 18px;
            border-radius: 5px; cursor: pointer; font-size: 14px; font-family: 'Cairo', sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); text-align: center;
        }
        .btn-model { background-color: #ffc107; color: black; }
        .btn-model.active { background-color: #e0a800; font-weight: bold; }
        .correct-button { background-color: #28a745; }
        .retry-button { background-color: #6c757d; }
        .review-button { background-color: #17a2b8; }

        /* أزرار وتنسيقات صندوق (أعرف لماذا) */
        .btn-explain {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            margin-right: 10px;
            vertical-align: middle;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn-explain:hover { background-color: #0056b3; }
        .explanation-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 12px;
            margin-top: 10px;
            font-size: 15px; 
            color: #333;
            line-height: 1.8;
            box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
        }
        
        /* تنسيقات الخطوات العمودية في الشرح */
        .exp-step {
            margin-top: 6px;
            padding-right: 12px;
            border-right: 3px solid #007bff;
            background-color: #ffffff;
            padding-top: 4px;
            padding-bottom: 4px;
            border-radius: 3px;
            border-left: 1px solid #eee;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            display: block; 
        }

        /* تنسيقات التمييز اللوني الرياضي */
        .c-x { color: #198754; font-weight: bold; } /* أخضر للـ س والأسس */
        .c-n { color: #d32f2f; font-weight: bold; } /* أحمر للأرقام والإشارات */

        .section-title {
            font-size: 18px; font-weight: bold; margin-top: 25px; margin-bottom: 10px;
            border-bottom: 1px solid #eee; padding-bottom: 5px;
        }
        
        /* تخطيط الأسئلة المقالية لتكون بجانب بعضها */
        .essay-questions-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 15px; 
            align-items: stretch;
        }

        .essay-question-block {
            border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px;
            background-color: #fdfdfd; display: flex; flex-direction: column;
            height: 100%;
        }
        .answer-space {
            min-height: 200px; 
            border: 1px solid #ccc; border-radius: 5px; margin-top: 10px;
            padding: 8px; flex-grow: 1; font-size: 16px; font-family: 'Cairo', sans-serif;
            resize: vertical; width: calc(100% - 16px);
        }
        .feedback {
            margin-top: 8px; padding: 8px; border-radius: 4px; font-weight: bold;
            display: none; text-align: right; line-height: 1.8;
        }
        .feedback.correct { background-color: #e9f7ec; color: #28a745; }
        .feedback.incorrect { background-color: #fdeeee; color: #dc3545; }
        
        .closing-statement {
            text-align: left;
            margin-top: auto;
            padding-top: 30px;
            font-weight: bold;
            font-size: 14px;
        }
        .closing-statement p {
            margin: 4px 0;
        }

        @media print {
            body { background-color: white; padding: 0; margin: 0; }
            .page { 
                box-shadow: none; margin: 0; width: 100%; min-height: auto;
                padding: 15mm; display: block; border-bottom: none; 
            }
            .page:not(:last-of-type) { page-break-after: always; }
            
            /* إخفاء الأزرار وشروحات الحل عند الطباعة */
            .controls, .feedback, .modal-overlay, .option input[type="radio"], textarea.answer-space, .btn-explain, .explanation-box { display: none !important; }
            
            .official-header { margin-bottom: 5px !important; }
            .student-info-bar { margin-bottom: 8px !important; } 
            .questions-grid { gap: 5px !important; } 
            .question-block { padding: 6px 10px !important; page-break-inside: avoid; margin-bottom: 2px !important; }
            .essay-question-block { page-break-inside: avoid; }

            .essay-question-block:not(.full-width-question)::after {
                content: ''; display: block; min-height: 380px; 
                border: 1px dotted #999;
                border-radius: 5px; background-color: #f9f9f9 !important;
                margin-top: 5px;
            }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>
    <div id="result-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>نتيجة الاختبار</h2>
            <div id="result-grid" class="result-grid">
                <strong>الدرجة النهائية:</strong> <span id="result-score"></span>
            </div>
            <div class="modal-buttons">
                <button class="btn review-button" onclick="document.getElementById('result-modal').style.display='none'">مراجعة الإجابات والحلول</button>
                <button class="btn retry-button" onclick="retryTest()">إعادة الاختبار</button>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn print-button" onclick="window.print()">طباعة</button>
        <button id="grade-all-btn" class="btn correct-button" onclick="gradeAll()">تصحيح الاختبار</button>
        <button id="retry-btn-main" class="btn retry-button" onclick="retryTest()" style="display: none;">إعادة الاختبار</button>
        <div class="controls-row">
            <button id="model-0-btn" class="btn btn-model active" onclick="renderModel(0)">نموذج أ</button>
            <button id="model-1-btn" class="btn btn-model" onclick="renderModel(1)">نموذج ب</button>
            <button id="model-2-btn" class="btn btn-model" onclick="renderModel(2)">نموذج جـ</button>
            <button id="model-3-btn" class="btn btn-model" onclick="renderModel(3)">نموذج د</button>
        </div>
    </div>

    <div id="test-container">
        <!-- Pages will be generated by JavaScript -->
    </div>

    <script>
        let currentModelIndex = 0;

        const allModels = [
            { // Model 0: أ
                name: "نموذج أ",
                questions: [
                    { id: 'q1', type: 'mcq', title: 'ناتج ضرب ثنائيتي الحد <span class="math-exp">(س - ٢)(س + ٥)</span> هو:', options: [{text:'<span class="math-exp">س² - ٣س - ١٠</span>'}, {text:'<span class="math-exp">س² + ٣س - ١٠</span>', correct:true}, {text:'<span class="math-exp">س² - ١٠</span>'}, {text:'<span class="math-exp">س² + ٧س - ١٠</span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp">(<span class="c-x">س</span> <span class="c-n">- ٢</span>) (<span class="c-x">س</span> <span class="c-n">+ ٥</span>)</span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-x">س²</span> <span class="c-n">+ ٥</span><span class="c-x">س</span> <span class="c-n">- ٢</span><span class="c-x">س</span> <span class="c-n">- ١٠</span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-x">س²</span> <span class="c-n">+ ٣</span><span class="c-x">س</span> <span class="c-n">- ١٠</span></span></div>' 
                    },
                    { id: 'q2', type: 'mcq', title: 'تحليل الفرق بين مربعين للعبارة <span class="math-exp">س² - ٩</span> هو:', options: [{text:'<span class="math-exp">(س - ٣)²</span>'}, {text:'<span class="math-exp">(س - ٣)(س + ٣)</span>', correct:true}, {text:'<span class="math-exp">(س - ٩)(س + ١)</span>'}, {text:'<span class="math-exp">(س + ٣)²</span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp"><span class="c-x">س²</span> <span class="c-n">- ٩</span> = <span class="c-x">س²</span> <span class="c-n">- ٣²</span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= (<span class="c-x">س</span> <span class="c-n">- ٣</span>)(<span class="c-x">س</span> <span class="c-n">+ ٣</span>)</span></div>' 
                    },
                    { id: 'q3', type: 'mcq', title: 'تحليل ثلاثية الحدود <span class="math-exp">س² - ٧س + ١٢</span> إلى عواملها هو:', options: [{text:'<span class="math-exp">(س + ٣)(س + ٤)</span>'}, {text:'<span class="math-exp">(س - ٢)(س - ٦)</span>'}, {text:'<span class="math-exp">(س - ٣)(س - ٤)</span>', correct:true}, {text:'<span class="math-exp">(س + ٣)(س - ٤)</span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp">العددان: <span class="c-n">-٣</span> &times; <span class="c-n">-٤</span> = <span class="c-n">١٢</span> ، <span class="c-n">-٣</span> + <span class="c-n">-٤</span> = <span class="c-n">-٧</span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= (<span class="c-x">س</span> <span class="c-n">- ٣</span>)(<span class="c-x">س</span> <span class="c-n">- ٤</span>)</span></div>' 
                    },
                    { id: 'q4', type: 'mcq', title: 'معادلة محور التماثل للدالة التربيعية <span class="math-exp">ص = س² - ٦س + ٨</span> هي:', options: [{text:'<span class="math-exp">س = -٣</span>'}, {text:'<span class="math-exp">س = ٦</span>'}, {text:'<span class="math-exp">س = -٦</span>'}, {text:'<span class="math-exp">س = ٣</span>', correct:true}], 
                      explanation: '<div class="exp-step"><span class="math-exp">س = <span class="fraction"><span class="numerator">-ب</span><span class="denominator">٢أ</span></span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">س = <span class="fraction"><span class="numerator">-(<span class="c-n">-٦</span>)</span><span class="denominator">٢(<span class="c-n">١</span>)</span></span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">س = <span class="fraction"><span class="numerator"><span class="c-n">٦</span></span><span class="denominator"><span class="c-n">٢</span></span></span> = <span class="c-n">٣</span></span></div>' 
                    },
                    { id: 'q5', type: 'mcq', title: 'المقطع الصادي للدالة التربيعية <span class="math-exp">ص = ٢س² + ٤س - ٥</span> هو:', options: [{text:'<span class="math-exp">٤</span>'}, {text:'<span class="math-exp">٢</span>'}, {text:'<span class="math-exp">-٥</span>', correct:true}, {text:'<span class="math-exp">٥</span>'}], 
                      explanation: '<div class="exp-step">المقطع الصادي هو دائماً الحد الثابت (جـ) في المعادلة.</div>' +
                                   '<div class="exp-step">إذن المقطع الصادي هو <span class="c-n">-٥</span></div>' 
                    },
                    { id: 'q6', type: 'mcq', title: 'قيمة المميز للمعادلة التربيعية <span class="math-exp">س² - ٤س + ٤ = ٠</span> هي:', options: [{text:'<span class="math-exp">١٦</span>'}, {text:'<span class="math-exp">-١٦</span>'}, {text:'<span class="math-exp">٨</span>'}, {text:'<span class="math-exp">٠</span>', correct:true}], 
                      explanation: '<div class="exp-step"><span class="math-exp">ب² - ٤أجـ</span></div>' +
                                   '<div class="exp-step"><span class="math-exp">(<span class="c-n">-٤</span>)<span class="c-x">²</span> <span class="c-n">- ٤</span>(<span class="c-n">١</span>)(<span class="c-n">٤</span>)</span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-n">١٦</span> <span class="c-n">- ١٦</span> = <span class="c-n">٠</span></span></div>' 
                    },
                    { id: 'q7', type: 'mcq', title: 'إذا كان المميز لمعادلة تربيعية سالباً، فإن عدد الحلول الحقيقية لها هو:', options: [{text:'لا يوجد حلول حقيقية', correct:true}, {text:'حل حقيقي واحد'}, {text:'حلان حقيقيان'}, {text:'عدد غير منتهٍ من الحلول'}], 
                      explanation: '<div class="exp-step"><span class="math-exp">المميز <span class="c-n">< ٠</span> (سالب)</span></div>' +
                                   '<div class="exp-step">إذن: لا يوجد جذور حقيقية للمنحنى لأنه لا يوجد جذر تربيعي لعدد سالب في الأعداد الحقيقية.</div>' 
                    },
                    { id: 'q8', type: 'mcq', title: 'تبسيط العبارة الجذرية <span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢٤</span></span></span> هو:', options: [{text:'<span class="math-exp">١٢</span>'}, {text:'<span class="math-exp">٤<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٦</span></span></span>'}, {text:'<span class="math-exp">٢<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٦</span></span></span>', correct:true}, {text:'<span class="math-exp">٦<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢٤</span></span> = <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num"><span class="c-n">٢ &times; ٢</span> &times; ٢ &times; ٣</span></span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-n">٢</span><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢ &times; ٣</span></span> = <span class="c-n">٢</span><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٦</span></span></span></div>' 
                    },
                    { id: 'q9', type: 'mcq', title: 'ناتج ضرب <span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span> &times; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٨</span></span></span> في أبسط صورة هو:', options: [{text:'<span class="math-exp">١٦</span>'}, {text:'<span class="math-exp">٤</span>', correct:true}, {text:'<span class="math-exp">٢<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٤</span></span></span>'}, {text:'<span class="math-exp">٨</span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span> &times; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٨</span></span> = <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">١٦</span></span></span></div>' +

                    { id: 'q7', type: 'mcq', title: 'إذا كان المميز لمعادلة تربيعية يساوي صفراً، فإن عدد الحلول الحقيقية لها هو:', options: [{text:'لا يوجد حلول حقيقية'}, {text:'حل حقيقي واحد', correct:true}, {text:'حلان حقيقيان'}, {text:'عدد غير منتهٍ من الحلول'}], 
                      explanation: '<div class="exp-step"><span class="math-exp">المميز <span class="c-n">= ٠</span></span></div>' +
                                   '<div class="exp-step">إذن: يوجد حل حقيقي واحد فقط (لأن المنحنى يمس محور السينات في نقطة واحدة).</div>' 
                    },
                    { id: 'q8', type: 'mcq', title: 'تبسيط العبارة الجذرية <span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢٧</span></span></span> هو:', options: [{text:'<span class="math-exp">٩</span>'}, {text:'<span class="math-exp">٣<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٩</span></span></span>'}, {text:'<span class="math-exp">٣<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٣</span></span></span>', correct:true}, {text:'<span class="math-exp">٩<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٣</span></span></span>'}], 
                      explanation: '<div class="exp-step">نكتب العدد كحاصل ضرب عوامله الأولية: <span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢٧</span></span> = <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num"><span class="c-n">٣ &times; ٣</span> &times; ٣</span></span></span></div>' +
                                   '<div class="exp-step">يخرج كل رقمين متشابهين من الجذر برقم واحد: <span class="math-exp"><span class="c-n">٣</span><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٣</span></span></span></div>' 
                    },
                    { id: 'q9', type: 'mcq', title: 'ناتج ضرب <span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span> &times; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٣٢</span></span></span> في أبسط صورة هو:', options: [{text:'<span class="math-exp">٦٤</span>'}, {text:'<span class="math-exp">١٦</span>'}, {text:'<span class="math-exp">٨</span>', correct:true}, {text:'<span class="math-exp">٤<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp"><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span> &times; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٣٢</span></span> = <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٦٤</span></span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-n">٨</span></span></div>' 
                    },
                    { id: 'q10', type: 'mcq', title: 'تبسيط العبارة <span class="math-exp">٥<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span> - ٣<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span> هو:', options: [{text:'<span class="math-exp">٨<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span>'}, {text:'<span class="math-exp">٢</span>'}, {text:'<span class="math-exp">٢<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span>', correct:true}, {text:'<span class="math-exp">١٥<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span>'}], 
                      explanation: '<div class="exp-step"><span class="math-exp">(<span class="c-n">٥</span> <span class="c-n">- ٣</span>)<span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span></div>' +
                                   '<div class="exp-step"><span class="math-exp">= <span class="c-n">٢</span><span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">٢</span></span></span></div>' 
                    },
                    { id: 'q11', type: 'essay', title: 'باستخدام <b>القانون العام</b>، أوجد حل المعادلة التربيعية: <span class="math-exp">س² - ٢س - ١٥ = ٠</span>', 
                      explanation: '<div class="exp-step">١- القانون: <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">-ب</span> &plusmn; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">ب² - ٤أجـ</span></span></span><span class="denominator">٢أ</span></span></span></div>' +
                                   '<div class="exp-step">٢- التعويض: <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">-(-٢)</span> &plusmn; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num">(<span class="c-n">-٢</span>)² <span class="c-n">- ٤</span>(<span class="c-n">١</span>)(<span class="c-n">-١٥</span>)</span></span></span><span class="denominator">٢(<span class="c-n">١</span>)</span></span></span></div>' +
                                   '<div class="exp-step">٣- التبسيط: <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">٢</span> &plusmn; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num"><span class="c-n">٤</span> <span class="c-n">+ ٦٠</span></span></span></span><span class="denominator"><span class="c-n">٢</span></span></span> = <span class="fraction"><span class="numerator"><span class="c-n">٢</span> &plusmn; <span class="ar-root"><span class="ar-root-sym">&radic;</span><span class="ar-root-num"><span class="c-n">٦٤</span></span></span></span><span class="denominator"><span class="c-n">٢</span></span></span></span></div>' +
                                   '<div class="exp-step">٤- حساب الجذر: <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">٢</span> &plusmn; <span class="c-n">٨</span></span><span class="denominator"><span class="c-n">٢</span></span></span></span></div>' +
                                   '<div class="exp-step">٥- الحلان: <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">٢</span> <span class="c-n">+ ٨</span></span><span class="denominator"><span class="c-n">٢</span></span></span> = <span class="c-n">٥</span></span> ، أو <span class="math-exp"><span class="c-x">س</span> = <span class="fraction"><span class="numerator"><span class="c-n">٢</span> <span class="c-n">- ٨</span></span><span class="denominator"><span class="c-n">٢</span></span></span> = <span class="c-n">-٣</span></span></div>' 
                    },
                    { id: 'q12', type: 'essay', title: 'باستخدام <b>إكمال المربع</b>، أوجد حل المعادلة: <span class="math-exp">س² - ١٠س + ١٦ = ٠</span>',
                      explanation: '<div class="exp-step">١- نقل الثابت للطرف الآخر: <span class="math-exp"><span class="c-x">س²</span> <span class="c-n">- ١٠</span><span class="c-x">س</span> = <span class="c-n">-١٦</span></span></div>' +
                                   '<div class="exp-step">٢- إضافة مربع نصف معامل س: <span class="math-exp">(<span class="c-n">-١٠</span>/٢)² = <span class="c-n">٢٥</span></span> للطرفين.</div>' +
                                   '<div class="exp-step">٣- المعادلة: <span class="math-exp"><span class="c-x">س²</span> <span class="c-n">- ١٠</span><span class="c-x">س</span> <span class="c-n">+ ٢٥</span> = <span class="c-n">-١٦</span> <span class="c-n">+ ٢٥</span></span></div>' +
                                   '<div class="exp-step">٤- تحليل المربع الكامل: <span class="math-exp">(<span class="c-x">س</span> <span class="c-n">- ٥</span>)² = <span class="c-n">٩</span></span></div>' +
                                   '<div class="exp-step">٥- أخذ الجذر للطرفين: <span class="math-exp"><span class="c-x">س</span> <span class="c-n">- ٥</span> = &plusmn;<span class="c-n">٣</span></span></div>' +
                                   '<div class="exp-step">٦- الحلان: <span class="math-exp"><span class="c-x">س</span> = <span class="c-n">٥</span> <span class="c-n">+ ٣</span> = <span class="c-n">٨</span></span> ، أو <span class="math-exp"><span class="c-x">س</span> = <span class="c-n">٥</span> <span class="c-n">- ٣</span> = <span class="c-n">٢</span></span></div>' 
                    }
                ]
            }
        ];

        function createPage(pageNumber, totalPages) {
            const page = document.createElement('div');
            page.className = 'page';
            let headerHTML = '';
            if (pageNumber === 1) {
                headerHTML = `
                    <div class="official-header">
                        <div class="header-col header-right">
                            <p>المملكة العربية السعودية</p>
                            <p>وزارة التعليم</p>
                            <p>إدارة التعليم بالمنطقة الشرقية</p>
                            <p>متوسطة الأمين</p>
                        </div>
                        <div class="header-col header-center">
                            <img src="https://ablan-math.github.io/img/education.png" alt="شعار وزارة التعليم" class="logo">
                        </div>
                        <div class="header-col header-left">
                            <p>المادة: رياضيات</p>
                            <p>الصف: الثالث المتوسط</p>
                            <p>الزمن: حصة دراسية</p>
                            <p>اختبار الفترة الأولى</p>
                        </div>
                    </div>
                    <div class="student-info-bar">
                        <span><strong>اسم الطالب:</strong> .................................................</span>
                        <span><strong>الصف:</strong> الثالث / .................</span>
                    </div>`; 
            }

            page.innerHTML = `
                <div class="page-content">
                    ${headerHTML}
                    <div class="page-questions-container">
                        <div id="page-mcq-${pageNumber}"></div>
                        <div id="page-essay-${pageNumber}"></div>
                    </div>
                </div>
                <div class="page-footer">
                    <span class="model-name"></span>
                    <span>صفحة ${pageNumber} من ${totalPages}</span>
                </div>
            `;
            return page;
        }

        function renderModel(modelIndex) {
            currentModelIndex = modelIndex;
            const modelData = allModels[modelIndex];
            const testContainer = document.getElementById('test-container');
            testContainer.innerHTML = ''; 

            const page1 = createPage(1, 2);
            const page2 = createPage(2, 2);

            const mcqContainer1 = page1.querySelector('#page-mcq-1');
            const mcqContainer2 = page2.querySelector('#page-mcq-2');
            const essayContainer2 = page2.querySelector('#page-essay-2');
            
            mcqContainer1.innerHTML = '<div class="questions-grid"></div>';
            mcqContainer2.innerHTML = '<div class="questions-grid"></div>';

            modelData.questions.forEach((q, index) => {
                const questionNumber = index + 1;
                let questionHTML = '';

                if (q.type === 'mcq') {
                    const optionLabels = ['أ', 'ب', 'ج', 'د'];
                    const optionsHTML = q.options.map((opt, optIndex) => `
                        <label class="option" ${opt.correct ? 'data-correct="true"' : ''}>
                            <input type="radio" name="${q.id}"><span class="option-label">${optionLabels[optIndex]}</span><span class="option-text">${opt.text}</span>
                        </label>
                    `).join('');
                    questionHTML = `
                        <div class="question-block" data-question-id="${q.id}">
                            <div class="question-prompt">
                                <span class="question-number">${questionNumber}.</span>
                                <span class="question-title">${q.title}</span>
                                <button class="btn-explain" id="btn-explain-${q.id}" onclick="toggleExplanation('${q.id}')" style="display:none;">أعرف لماذا؟</button>
                            </div>
                            <div class="options-container">${optionsHTML}</div>
                            <div id="explain-${q.id}" class="explanation-box" style="display:none;">
                                ${q.explanation}
                            </div>
                        </div>`;
                    
                    if (questionNumber <= 8) {
                        mcqContainer1.querySelector('.questions-grid').innerHTML += questionHTML;
                    } else { 
                        mcqContainer2.querySelector('.questions-grid').innerHTML += questionHTML;
                    }
                } else {
                    let essayGrid = essayContainer2.querySelector('.essay-questions-container');
                    
                    if (!essayGrid) {
                        essayContainer2.innerHTML += `
                            <h2 class="section-title">الأسئلة المقالية</h2>
                            <div class="essay-questions-container"></div>`;
                        essayGrid = essayContainer2.querySelector('.essay-questions-container');
                    }
                    
                    essayGrid.innerHTML += `
                        <div class="essay-question-block">
                            <div class="question-prompt">
                                <span class="question-number">${questionNumber}.</span>
                                <span class="question-title">${q.title}</span>
                                <button class="btn-explain" id="btn-explain-${q.id}" onclick="toggleExplanation('${q.id}')" style="display:none;">أعرف لماذا؟</button>
                            </div>
                            <textarea class="answer-space" id="${q.id}-answer" placeholder="اكتب خطوات الحل هنا..."></textarea>
                            <div class="feedback" id="${q.id}-feedback"></div>
                            <div id="explain-${q.id}" class="explanation-box" style="display:none;">
                                ${q.explanation}
                            </div>
                        </div>`;
                }
            });

            const closingHTML = `
                <div class="closing-statement">
                    <p>بالتوفيق والسداد لطلابي الأعزاء.</p>
                    <p>أستاذكم: عبد العزيز خالد العبلان</p>
                </div>
            `;
            page2.querySelector('.page-questions-container').innerHTML += closingHTML;

            testContainer.appendChild(page1);
            testContainer.appendChild(page2);

            document.querySelectorAll('.model-name').forEach(el => el.textContent = modelData.name);
            document.querySelectorAll('.btn-model').forEach((btn, index) => {
                btn.classList.toggle('active', index === modelIndex);
            });
            
            retryTest(false); 
        }

        function shuffleOptions() {
            const questions = document.querySelectorAll('.question-block[data-question-id]');
            const optionLabels = ['أ', 'ب', 'ج', 'د'];
            questions.forEach(question => {
                const container = question.querySelector('.options-container');
                if (container) {
                    const options = Array.from(container.children);
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    container.innerHTML = '';
                    options.forEach((option, index) => {
                        option.querySelector('.option-label').textContent = optionLabels[index];
                        container.appendChild(option);
                    });
                }
            });
        }

        // إظهار أو إخفاء صندوق الشرح
        function toggleExplanation(qId) {
            const explainBox = document.getElementById(`explain-${qId}`);
            if (explainBox.style.display === 'none') {
                explainBox.style.display = 'block';
            } else {
                explainBox.style.display = 'none';
            }
        }

        function gradeMultipleChoice() {
            let correctCount = 0;
            for(let i=1; i<=10; i++){
                const qId = 'q' + i;
                const question = document.querySelector(`.question-block[data-question-id="${qId}"]`);
                if(question){
                    const userAnswerNode = document.querySelector(`input[name="${qId}"]:checked`);
                    const allOptions = question.querySelectorAll('.option');
                    allOptions.forEach(opt => opt.classList.remove('correct', 'incorrect'));
                    
                    const correctAnswerNode = question.querySelector('.option[data-correct="true"]');
                    if (correctAnswerNode) {
                         correctAnswerNode.classList.add('correct');
                    }

                    if (userAnswerNode) {
                        const selectedLabel = userAnswerNode.parentElement;
                        if (selectedLabel.dataset.correct) {
                            correctCount++;
                        } else {
                            selectedLabel.classList.add('incorrect');
                        }
                    }
                }
            }
            return correctCount * 1.5;
        }

        function gradeEssays() {
            let totalEssayScore = 0;
            
            const answer11 = document.getElementById('q11-answer').value;
            const feedback11 = document.getElementById('q11-feedback');
            totalEssayScore += gradeSingleEssay(answer11, feedback11, 11, currentModelIndex);

            const answer12 = document.getElementById('q12-answer').value;
            const feedback12 = document.getElementById('q12-feedback');
            totalEssayScore += gradeSingleEssay(answer12, feedback12, 12, currentModelIndex);
            
            return totalEssayScore;
        }

        function gradeSingleEssay(answer, feedbackEl, questionNumber, modelIdx) {
            let score = 0;
            const cleanAnswer = answer.replace(/\s/g, '').replace(/،/g, ',');
            let correct = false;
            let feedbackText = '';
            
            if (questionNumber === 11) {
                 if (modelIdx === 0) {
                      if (cleanAnswer.includes('7') || cleanAnswer.includes('٧')) score += 1.25;
                      if (cleanAnswer.includes('-2') || cleanAnswer.includes('-٢')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 1) {
                      if (cleanAnswer.includes('2') || cleanAnswer.includes('٢')) score += 1.25;
                      if (cleanAnswer.includes('-4') || cleanAnswer.includes('-٤')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 2) { 
                      if (cleanAnswer.includes('5') || cleanAnswer.includes('٥')) score += 1.25;
                      if (cleanAnswer.includes('-1') || cleanAnswer.includes('-١')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 3) {
                      if (cleanAnswer.includes('5') || cleanAnswer.includes('٥')) score += 1.25;
                      if (cleanAnswer.includes('-3') || cleanAnswer.includes('-٣')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 }
                 feedbackEl.innerHTML = `<strong>الدرجة: ${score} / 2.5</strong><br>${feedbackText}`;
            } else if (questionNumber === 12) {
                 if (modelIdx === 0) {
                      if (cleanAnswer.includes('-2') || cleanAnswer.includes('-٢')) score += 1.25;
                      if (cleanAnswer.includes('-4') || cleanAnswer.includes('-٤')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 1) {
                      if (cleanAnswer.includes('6') || cleanAnswer.includes('٦')) score += 1.25;
                      if (cleanAnswer.includes('2') || cleanAnswer.includes('٢')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 2) { 
                      if (cleanAnswer.includes('-6') || cleanAnswer.includes('-٦')) score += 1.25;
                      if (cleanAnswer.includes('-4') || cleanAnswer.includes('-٤')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 } else if (modelIdx === 3) {
                      if (cleanAnswer.includes('8') || cleanAnswer.includes('٨')) score += 1.25;
                      if (cleanAnswer.includes('2') || cleanAnswer.includes('٢')) score += 1.25;
                      correct = score === 2.5;
                      feedbackText = correct ? 'إجابة صحيحة!' : 'إجابة غير مكتملة، يرجى مراجعة خطوات الحل.';
                 }
                 feedbackEl.innerHTML = `<strong>الدرجة: ${score} / 2.5</strong><br>${feedbackText}`;
            }

            feedbackEl.className = correct ? 'feedback correct' : 'feedback incorrect';
            feedbackEl.style.display = 'block';
            return score;
        }

        function gradeAll() {
            document.getElementById('grade-all-btn').style.display = 'none';
            document.getElementById('retry-btn-main').style.display = 'block';
            
            const mcqScore = gradeMultipleChoice();
            const essayScore = gradeEssays();
            const totalScore = mcqScore + essayScore;
            document.getElementById('result-score').textContent = `${totalScore} / 20`;
            document.getElementById('result-modal').style.display = 'flex';
            
            // إظهار أزرار "أعرف لماذا؟" بعد التصحيح
            document.querySelectorAll('.btn-explain').forEach(btn => {
                btn.style.display = 'inline-block';
            });
        }

        function retryTest(doShuffle = true) {
             document.getElementById('grade-all-btn').style.display = 'block';
             document.getElementById('retry-btn-main').style.display = 'none';
             document.getElementById('result-modal').style.display = 'none';

             document.querySelectorAll('input[type="radio"]').forEach(radio => { radio.checked = false; });
             document.querySelectorAll('.option').forEach(option => { option.classList.remove('correct', 'incorrect'); });
             document.querySelectorAll('textarea.answer-space').forEach(area => { area.value = ''; });
             document.querySelectorAll('.feedback').forEach(feedback => { feedback.style.display = 'none'; });
            
             // إخفاء أزرار وصناديق "أعرف لماذا؟" عند إعادة الاختبار
             document.querySelectorAll('.btn-explain').forEach(btn => { btn.style.display = 'none'; });
             document.querySelectorAll('.explanation-box').forEach(box => { box.style.display = 'none'; });
            
             if (doShuffle) {
                 shuffleOptions();
             }
             window.scrollTo(0, 0);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            renderModel(0);
        });

    </script>
</body>
</html>
